# Netlify settings.
# NOTE (13 Oct 2026): the plain-JS prototype in /game is RETIRED and must not be published.
# The production app lives in /app (Next.js) and needs the Postgres storage adapter and the
# Netlify Next.js runtime before it can be deployed. Until then the site publishes only a static
# "prototype retired" page from /retired, so the old prototype is replaced rather than left live.
# This file overrides the build settings in the Netlify dashboard.
[build]
  publish = "retired"   # holds a static "prototype retired" page

[[headers]]
  for = "/*"
  [headers.values]
    # Internal training prototype: keep it out of search engines
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
