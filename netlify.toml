# Netlify settings for the MeriQuest prototype (static files in /game, no build step).
# This file overrides the build settings in the Netlify dashboard.
[build]
  publish = "game"

[[headers]]
  for = "/*"
  [headers.values]
    # Internal training prototype: keep it out of search engines
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
